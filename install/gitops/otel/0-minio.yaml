apiVersion: v1
kind: Namespace
metadata:
  name: obs-minio
  annotations:
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: Secret
metadata: 
  name: minio-credentials
  namespace: obs-minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  password: U3VwZXJTZWNyZXQxMjMh
  user: YWRtaW4=
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: obs-minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: obs-minio
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio        
        image: cgr.dev/chainguard/minio:latest
        args: ["server", "/data", "--console-address", ":9001"]
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef: 
              name: minio-credentials 
              key: user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: 
              name: minio-credentials 
              key: password
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: minio-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: obs-minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ports:
  - name: api
    port: 9000
    targetPort: 9000
  - name: console
    port: 9001
    targetPort: 9001
  selector:
    app: minio
---
apiVersion: route.openshift.io/v1
kind: Route
metadata: 
  labels:
    app: minio    
  name: minio-console
  namespace: obs-minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  port:
    targetPort: 9001
  tls:
    termination: edge
  to:
    kind: Service
    name: minio
    weight: 100
  wildcardPolicy: None
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: script-bucket-creation
  namespace: obs-minio
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  create-bucket.sh: |-
    #!/bin/sh
    set -eu

    # Define a writeable config directory inside the container
    mkdir -p /tmp    
    export CONFIG_DIR=/tmp/.mc    


    # Use the --config-dir flag on ALL mc commands
    echo "Using mc config directory: $CONFIG_DIR"
    echo $CONFIG_DIR
    mc --config-dir $CONFIG_DIR --version

    echo "Setting alias..."
    mc --config-dir $CONFIG_DIR alias set minio http://minio.obs-minio.svc:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD

    echo "Listing buckets..."
    mc --config-dir $CONFIG_DIR ls minio

    # Use --ignore-existing to make the script idempotent
    echo "Creating buckets..."
    mc --config-dir $CONFIG_DIR mb --ignore-existing minio/loki-bucket
    mc --config-dir $CONFIG_DIR mb --ignore-existing minio/tempo-bucket

    echo "✅ Minio buckets are ready."
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-buckets-creation-job
  namespace: obs-minio
  labels: 
    observability-demo-framework: bootstrap
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 180  
  template:
    spec:      
      containers:
      - name: minio-bootstrap
        image: cgr.dev/chainguard/minio:latest
        command: ["/bin/sh", "/runner/create-bucket.sh"]
        env: 
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef: 
              name: minio-credentials 
              key: user
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef: 
              name: minio-credentials 
              key: password
        volumeMounts:
        - name: runner-vol
          mountPath: /runner
      restartPolicy: Never
      volumes: 
      - name: runner-vol
        configMap:
          name: script-bucket-creation
          defaultMode: 0555
