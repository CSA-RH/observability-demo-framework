apiVersion: v1
kind: Namespace
metadata:
  name: obs-loki
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki-collector
  namespace: obs-loki
---
apiVersion: v1
kind: Secret
metadata:
  name: loki-minio-secret
  namespace: obs-loki
stringData:  
  endpoint: "http://minio.obs-minio.svc:9000"
  bucketnames: "loki-bucket"
  access_key_id: "admin"
  access_key_secret: "SuperSecret123!"  
  
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-collector-logs-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-collector-logs-writer
subjects:
- kind: ServiceAccount
  name: loki-collector
  namespace: obs-loki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:  
  name: collect-application-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-application-logs
subjects:
- kind: ServiceAccount
  name: loki-collector
  namespace: obs-loki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collect-audit-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-audit-logs
subjects:
- kind: ServiceAccount
  name: loki-collector
  namespace: obs-loki
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: collect-infrastructure-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: collect-infrastructure-logs
subjects:
- kind: ServiceAccount
  name: loki-collector
  namespace: obs-loki
---
apiVersion: loki.grafana.com/v1
kind: LokiStack
metadata:
  name: loki
  namespace: obs-loki
spec:
  tenants:
    mode: openshift-logging
  managementState: Managed
  limits:
    global:
      queries:
        queryTimeout: 3m
  storageClassName: crc-csi-hostpath-provisioner
  storage:
    schemas:
      - effectiveDate: '2022-06-01'
        version: v12
      - effectiveDate: "2024-04-02"
        version: v13
    secret:
      name: loki-minio-secret
      type: s3
  hashRing:
    type: memberlist
  size: 1x.demo
