apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obs-opentelemetry
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:  
    repoURL: https://github.com/CSA-RH/observability-demo-framework.git
    targetRevision: main
    path: install/gitops/otel
  destination:
    server: https://kubernetes.default.svc
    namespace: obs-otel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
