apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-lab-otel
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  project: default
  source:  
    repoURL: https://github.com/CSA-RH/observability-demo-framework.git
    targetRevision: main
    path: install/gitops/opentelemetry/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: obs-otel
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Operand CRDs (LokiStack, TempoStack, OpenTelemetryCollector, ...) only exist once the
      # operators from observability-lab-operators are installed. Skip the dry-run for them and
      # retry until they are available.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: openshift-gitops
