apiVersion: batch/v1
kind: Job
metadata:
  name: operator-waiter-job
  namespace: {{ .Values.applicationNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: operator-waiter-sa
      restartPolicy: OnFailure
      containers:
      - name: waiter
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command: ["/bin/bash", "/scripts/waiter.sh"]
        env:
        - name: OPERATOR_LIST
          value: {{ .Values.operatorCheckList | quote }}
        volumeMounts:
        - name: script-volume
          mountPath: /scripts
      volumes:
      - name: script-volume
        configMap:
          name: bootstrap-scripts
          defaultMode: 0555
          items:
          - key: wait-for-operators.sh
            path: waiter.sh