apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-console
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-console
    observability-demo-framework: frontend  
  {{- if .Values.annotationsWave4 }}
  annotations: {{- toYaml .Values.annotationsWave4 | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-console
  template:
    metadata:
      labels:
        app: obs-console
    spec:
      containers:
      - image: {{ include "obs.image" (dict "image" .Values.images.frontend "root" .) }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        name: obs-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-orchestrator  
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-orchestrator
    observability-demo-framework: 'backend'
  {{- if .Values.annotationsWave4 }}
  annotations: {{- toYaml .Values.annotationsWave4 | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-orchestrator
  strategy: {}
  template:
    metadata:      
      labels:
        app: obs-orchestrator
        observability-demo-framework: 'backend'
    spec:
      serviceAccountName: obs-orchestrator-sa
      volumes:
      - name: keycloak-route-ca-secret
        secret:
          secretName: keycloak-route-ca-secret
          defaultMode: 420
      containers:
      - image: {{ include "obs.image" (dict "image" .Values.images.backend "root" .) }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        name: obs-orchestrator
        volumeMounts:
        - name: keycloak-route-ca-secret
          readOnly: true
          mountPath: /etc/ssl/keycloak
        env:
        - name: KEYCLOAK_ISSUER
          valueFrom:
            secretKeyRef:
              name: keycloak-route-ca-secret
              key: idp-issuer
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/keycloak/ca.crt
