apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-front
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-front
    observability-demo-framework: frontend  
  {{- if .Values.annotationsWave4 }}
  annotations: {{- toYaml .Values.annotationsWave4 | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-front
  template:
    metadata:
      labels:
        app: obs-front
    spec:
      containers:
      - image: obs-front:latest
        name: obs-front
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-main-api  
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-main-api
    observability-demo-framework: 'backend'
  {{- if .Values.annotationsWave4 }}
  annotations: {{- toYaml .Values.annotationsWave4 | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-main-api
  strategy: {}
  template:
    metadata:      
      labels:
        app: obs-main-api
        observability-demo-framework: 'backend'
    spec:
      serviceAccountName: obs-main-api-sa
      volumes:
      - name: keycloak-route-ca-secret
        secret:
          secretName: keycloak-route-ca-secret
          defaultMode: 420
      containers:
      - image: obs-main-api:latest
        name: obs-main-api
        volumeMounts:
        - name: keycloak-route-ca-secret
          readOnly: true
          mountPath: /etc/ssl/keycloak
        env:
        - name: KEYCLOAK_ISSUER
          valueFrom:
            secretKeyRef:
              name: keycloak-route-ca-secret
              key: idp-issuer
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/keycloak/ca.crt
