apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-console
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-console
    observability-demo-framework: frontend  
  annotations:
    {{- with .Values.annotationsWave4 }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if not .Values.images.registry }}
    image.openshift.io/triggers: {{ include "obs.imageTrigger" (dict "image" .Values.images.frontend "container" "obs-console") | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-console
  template:
    metadata:
      labels:
        app: obs-console
    spec:
      containers:
      - image: {{ include "obs.image" (dict "image" .Values.images.frontend "root" .) }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        name: obs-console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: obs-orchestrator  
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-orchestrator
    observability-demo-framework: 'backend'
  annotations:
    {{- with .Values.annotationsWave4 }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if not .Values.images.registry }}
    image.openshift.io/triggers: {{ include "obs.imageTrigger" (dict "image" .Values.images.backend "container" "obs-orchestrator") | quote }}
    {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: obs-orchestrator
  strategy: {}
  template:
    metadata:      
      labels:
        app: obs-orchestrator
        observability-demo-framework: 'backend'
    spec:
      serviceAccountName: obs-orchestrator-sa
      volumes:
      - name: keycloak-route-ca-secret
        secret:
          secretName: keycloak-route-ca-secret
          defaultMode: 420
      containers:
      - image: {{ include "obs.image" (dict "image" .Values.images.backend "root" .) }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        name: obs-orchestrator
        volumeMounts:
        - name: keycloak-route-ca-secret
          readOnly: true
          mountPath: /etc/ssl/keycloak
        env:
        - name: KEYCLOAK_ISSUER
          valueFrom:
            secretKeyRef:
              name: keycloak-route-ca-secret
              key: idp-issuer
        - name: REQUESTS_CA_BUNDLE
          value: /etc/ssl/keycloak/ca.crt
        # Only the console may call the API from a browser. Optional: secrets created before
        # frontend-url existed leave it unset and the API falls back to any origin.
        - name: CORS_ALLOWED_ORIGINS
          valueFrom:
            secretKeyRef:
              name: keycloak-route-ca-secret
              key: frontend-url
              optional: true
