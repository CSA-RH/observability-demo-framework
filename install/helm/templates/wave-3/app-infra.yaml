apiVersion: v1
kind: ServiceAccount
metadata:  
  name: obs-orchestrator-sa
  namespace: {{ .Values.applicationNamespace }}
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: obs-orchestrator-role
  namespace: {{ .Values.applicationNamespace }}
  labels:
    observability-demo-framework: 'rbac'
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["list"]
  - apiGroups: ["batch"]
    verbs: ["create", "watch", "get"]
    resources: ["jobs"]
  - apiGroups: ["batch"]
    verbs: ["get"]
    resources: ["jobs/status"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["grafana.integreatly.org"]
    resources: ["grafanadatasources"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obs-orchestrator-clusterrole
  labels:
    observability-demo-framework: 'rbac'
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["consoles"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""] #TODO we can limit it to resource names. 
    resources: ["secrets", "configmaps"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.rhobs"] 
    resources: ["monitoringstacks", "servicemonitors", "prometheusrules"] 
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["monitoring.rhobs"]
    resources: ["prometheusrules"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: obs-orchestrator-rolebinding
  namespace: {{ .Values.applicationNamespace }}
  labels:
    observability-demo-framework: 'rbac'
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: obs-orchestrator-sa
    namespace: {{ .Values.applicationNamespace }}
roleRef:
  kind: Role
  name: obs-orchestrator-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obs-orchestrator-clusterrolebinding
  labels:
    observability-demo-framework: 'rbac'
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
subjects:
  - kind: ServiceAccount
    name: obs-orchestrator-sa
    namespace: {{ .Values.applicationNamespace }}
roleRef:
  kind: ClusterRole
  name: obs-orchestrator-clusterrole
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: v1
kind: Service
metadata:
  name: obs-orchestrator
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-orchestrator
    observability-demo-framework: backend
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}  
spec:
  ports:
  - port: 8000
    protocol: TCP
    targetPort: 8000
  selector:
    app: obs-orchestrator
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: obs-orchestrator
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-orchestrator
    observability-demo-framework: 'backend'
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
spec:
  port:
    targetPort: 8000
  to:
    kind: Service
    name: obs-orchestrator
  tls: 
    termination: edge
---
apiVersion: v1
kind: Service
metadata:
  name: obs-console
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-console
    app.kubernetes.io/instance: obs-demo-wave-4
    observability-demo-framework: frontend
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: obs-console
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: obs-console
  namespace: {{ .Values.applicationNamespace }}
  labels:
    app: obs-console
    observability-demo-framework: frontend
  {{- if .Values.annotationsWave3 }}
  annotations: {{- toYaml .Values.annotationsWave3 | nindent 4 }}
  {{- end }}
spec:
  port:
    targetPort: 8080
  to:
    kind: Service
    name: obs-console
  tls: 
    termination: edge