applicationNamespace: obs-demo
idpNamespace: obs-idp

jobKeycloakCertServiceAccount: job-keycloak-cert-generator-sa
jobBuildImagesServiceAccount: build-image-sa
jobSyncUsersServiceAccount: obs-sync-users

operatorCheckList: "rhbk-operator cluster-observability-operator"

# Cluster Observability Operator configuration
observabilityOperator:
  name: cluster-observability-operator
  namespace: openshift-operators
  channel: stable
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  startingCSV: cluster-observability-operator.v1.3.0

annotationsWave0: 
  argocd.argoproj.io/sync-wave: "0"
annotationsWave1: 
  argocd.argoproj.io/sync-wave: "1"
annotationsWave2: 
  argocd.argoproj.io/sync-wave: "2"
annotationsWave3: 
  argocd.argoproj.io/sync-wave: "3"
annotationsWave4: 
  argocd.argoproj.io/sync-wave: "4"


# Container images for the application Deployments.
# registry: leave empty to use the in-cluster registry populated by the BuildConfigs
#   (image-registry.openshift-image-registry.svc:5000/<applicationNamespace>).
#   Set it (e.g. quay.io/<org>) once images are published externally.
images:
  registry: ""
  pullPolicy: Always
  frontend:
    name: obs-console
    tag: latest
  backend:
    name: obs-orchestrator
    tag: latest
