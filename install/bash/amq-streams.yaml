apiVersion: v1
kind: Namespace
metadata:
  name: amq-streams
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: amq-streams
  labels:
    strimzi.io/cluster: telemetry-kafka
spec:
  replicas: 2
  roles:
    - controller
    - broker
  storage:
    type: ephemeral  # Change to persistent-claim if using persistent Ceph/ODF storage
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: telemetry-kafka
  namespace: amq-streams
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    metadataVersion: 4.1-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      # Replication factors adapted for 2 nodes
      offsets.topic.replication.factor: 2
      transaction.state.log.replication.factor: 2
      # Allows single-node survival during updates/maintenance
      transaction.state.log.min.isr: 1
      default.replication.factor: 2
      min.insync.replicas: 1
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otlp-logs
  namespace: amq-streams
  labels:
    strimzi.io/cluster: telemetry-kafka
spec:
  partitions: 2
  replicas: 2
---
# Optional: keep trace and metric topics ready if also sending to Tempo and VictoriaMetrics
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: otlp-spans
  namespace: amq-streams
  labels:
    strimzi.io/cluster: telemetry-kafka
spec:
  partitions: 2
  replicas: 2
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: otlp-metrics
  namespace: amq-streams
  labels:
    strimzi.io/cluster: telemetry-kafka
spec:
  partitions: 2
  replicas: 2
