name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint
        run: helm lint install/helm
      - name: Render (default values)
        run: helm template ci install/helm > /dev/null
      - name: Render (external registry)
        run: helm template ci install/helm --set images.registry=quay.io/example > /dev/null

  backend:
    name: Backend (obs-orchestrator)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obs-orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            obs-orchestrator/app/requirements.txt
            obs-orchestrator/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Coverage floor acts as a ratchet: raise it as coverage grows, never lower it.
      - run: python -m pytest --cov=app --cov-report=term-missing --cov-fail-under=50

  frontend:
    name: Frontend (obs-console)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obs-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: obs-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  client-node:
    name: Client (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obs-clients/obs-client-api-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm test

  client-dotnet:
    name: Client (.NET)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obs-clients/obs-client-api-dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build obs-client-api-dotnet.csproj
